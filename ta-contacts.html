<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CE 210 Lab – TA Contact Info</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: transparent; overflow: hidden; margin: 0; padding: 0; }
    </style>
</head>
<body class="bg-transparent font-sans">

    <div id="ta-container">
        <div class="text-gray-400 text-sm italic py-2 font-mono">Loading TA info...</div>
    </div>

    <script>
        const TA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQtseO-b1lNH6L6ltARhp7fC-s4UNylDTRVkivnRYeH40yv2hvyCqZe3a2R0K9sy4BRRLMjh_R78NIK/pub?gid=688018773&single=true&output=csv';

        async function loadTAData() {
            try {
                const separator = TA_CSV_URL.includes('?') ? '&' : '?';
                const fetchUrl = `${TA_CSV_URL}${separator}t=${new Date().getTime()}`;
                
                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error("Failed to fetch TA data");

                const csvText = await response.text();
                const rows = parseCSV(csvText);
                if (rows.length < 3) return;

                const tas = rows.slice(2)
                    .map(r => r.map(cell => cell.trim()))
                    .filter(r => r[0] && r[0] !== '');

                renderTAs(tas);
            } catch (err) {
                console.error(err);
                document.getElementById('ta-container').innerHTML = `
                    <div class="text-red-500 text-sm py-2">Unable to load TA contact details.</div>
                `;
                notifyParentHeight();
            }
        }

        function parseCSV(text) {
            return text.split(/\r\n|\n/).map(line => {
                let row = [], inQuotes = false, entry = '';
                for (let char of line) {
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { row.push(entry); entry = ''; }
                    else entry += char;
                }
                row.push(entry);
                return row.map(c => c.replace(/^"|"$/g, '').trim());
            }).filter(row => row.some(c => c !== ''));
        }

        function renderTAs(tas) {
            const container = document.getElementById('ta-container');
            container.innerHTML = `
                <div class="space-y-4 text-sm text-gray-700">
                    ${tas.map(ta => `
                        <div>
                            <div><strong class="text-gray-900 text-base">${ta[0]}</strong> – <a href="mailto:${ta[1]}" class="text-blue-600 hover:underline">${ta[1]}</a></div>
                            <div class="mt-1 text-gray-600"><span class="font-semibold text-gray-500">Availability:</span> ${ta[2] || 'Contact via email'}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            notifyParentHeight();
        }

        function notifyParentHeight() {
            setTimeout(() => {
                const height = document.documentElement.scrollHeight;
                window.parent.postMessage({ type: 'resize-ta-iframe', height: height }, '*');
            }, 50);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTAData();
            setInterval(loadTAData, 30000);
        });
    </script>
</body>
</html>
