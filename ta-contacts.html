<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CE 210 Lab – TA Contact Info</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { background: transparent; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        .ta-email { text-decoration: none !important; }
        .ta-email:hover { text-decoration: none !important; }
    </style>
</head>
<body class="bg-transparent font-sans">

    <div id="ta-container" class="h-full flex flex-col justify-center items-center text-center">
        <div class="text-gray-400 text-sm italic py-2 flex items-center justify-center">
            <span>Loading TA Information</span>
            <span class="inline-flex ml-1.5 space-x-1">
                <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0s;"></span>
                <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s;"></span>
                <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s;"></span>
            </span>
        </div>
        <div class="text-gray-400 text-xs italic">Refresh page if taking too long.</div>
    </div>

    <script>
        const TA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQtseO-b1lNH6L6ltARhp7fC-s4UNylDTRVkivnRYeH40yv2hvyCqZe3a2R0K9sy4BRRLMjh_R78NIK/pub?gid=688018773&single=true&output=csv';
        
        let cachedTAs = null;

        async function loadTAData() {
            try {
                const separator = TA_CSV_URL.includes('?') ? '&' : '?';
                const fetchUrl = `${TA_CSV_URL}${separator}t=${new Date().getTime()}`;
                
                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error("Failed to fetch TA data");

                const csvText = await response.text();
                const rows = parseCSV(csvText);
                if (rows.length < 3) return;

                const tas = rows.slice(2)
                    .map(r => r.map(cell => cell.trim()))
                    .filter(r => r[0] && r[0] !== '');

                cachedTAs = tas;
                renderTAs(tas);
            } catch (err) {
                console.error("Fetch failed, keeping cached data if available:", err);
                
                if (!cachedTAs) {
                    document.getElementById('ta-container').className = "h-full flex flex-col justify-center items-center text-center";
                    document.getElementById('ta-container').innerHTML = `
                        <div class="text-gray-400 text-sm italic py-2 flex items-center justify-center">
                            <span>Loading TA Information</span>
                            <span class="inline-flex ml-1.5 space-x-1">
                                <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0s;"></span>
                                <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s;"></span>
                                <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s;"></span>
                            </span>
                        </div>
                        <div class="text-gray-400 text-xs italic">Refresh page if taking too long.</div>
                    `;
                }
            }
        }

        function parseCSV(text) {
            return text.split(/\r\n|\n/).map(line => {
                let row = [], inQuotes = false, entry = '';
                for (let char of line) {
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { row.push(entry); entry = ''; }
                    else entry += char;
                }
                row.push(entry);
                return row.map(c => c.replace(/^"|"$/g, '').trim());
            }).filter(row => row.some(c => c !== ''));
        }

        function renderTAs(tas) {
            const container = document.getElementById('ta-container');
            container.className = "h-full flex flex-col justify-between text-sm text-gray-700";
            container.innerHTML = `
                ${tas.map(ta => `
                    <div>
                        <div class="flex justify-between items-baseline">
                            <strong class="text-gray-900 text-base">${ta[0]}</strong>
                            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=${ta[1]}" target="_blank" rel="noopener" class="text-blue-600 text-sm ta-email">${ta[1]}</a>
                        </div>
                        <div class="mt-1 text-gray-600"><span class="font-semibold text-gray-500">Availability:</span> ${ta[2] || 'Contact via email'}</div>
                    </div>
                `).join('')}
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTAData();
            setInterval(loadTAData, 30000);
        });
    </script>
</body>
</html>
