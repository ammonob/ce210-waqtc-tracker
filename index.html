<!-- JavaScript Data Fetcher & UI Renderer -->
    <script>
        const BASE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRsP2SePg80v-QIdz-1NIRrFOpmZDaGDiPZC0uwBjaxXNpBtl597rpVQ-xBtgQD_Vao9HV8_dKp8Tvz/pub?output=csv';

        async function loadTrackerData() {
            try {
                // Append a timestamp to the URL to bypass browser caching
                const CSV_URL = `${BASE_CSV_URL}&t=${new Date().getTime()}`;
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                if (rows.length === 0) throw new Error("CSV file is empty");

                const headers = rows[0]; 
                const totalTests = headers.length - 1;
                const studentRows = rows.slice(1).filter(row => row && row[0] && row[0].trim() !== '');

                let students = studentRows.map(row => {
                    const name = row[0];
                    let completedCount = 0;
                    const tests = {};

                    for (let i = 1; i < headers.length; i++) {
                        const testName = headers[i];
                        const cellValue = row[i] ? row[i].trim() : '';
                        const isDone = cellValue !== ''; 
                        tests[testName] = isDone;
                        if (isDone) completedCount++;
                    }

                    return { name, completedCount, tests };
                });

                students.sort((a, b) => b.completedCount - a.completedCount);

                renderLeaderboard(students, totalTests);
                renderChecklist(headers.slice(1), students);

            } catch (error) {
                console.error("Failed to load Google Sheet data:", error);
            }
        }

        function parseCSV(text) {
            let lines = text.split(/\r\n|\n/);
            return lines.map(line => {
                let row = [];
                let inQuotes = false;
                let entry = '';
                for (let i = 0; i < line.length; i++) {
                    let char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(entry.trim());
                        entry = '';
                    } else {
                        entry += char;
                    }
                }
                row.push(entry.trim());
                return row.map(cell => cell.replace(/^"|"$/g, '').trim());
            }).filter(row => row.some(cell => cell !== ''));
        }

        function renderLeaderboard(students, totalTests) {
            const container = document.getElementById('class-leaderboard');
            if (!container) return;

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    ${students.map((s, index) => {
                        let rankDisplay = `#${index + 1}`;
                        if (index === 0) rankDisplay = '🥇';
                        else if (index === 1) rankDisplay = '🥈';
                        else if (index === 2) rankDisplay = '🥉';

                        const percent = totalTests > 0 ? (s.completedCount / totalTests) * 100 : 0;

                        return `
                            <div class="flex items-center p-3 bg-gray-50 rounded-lg border border-gray-200 shadow-sm hover:shadow transition-shadow duration-150 h-[56px]">
                                <div class="font-bold text-center w-8 text-lg text-gray-800">${rankDisplay}</div>
                                <div class="flex-1 ml-2">
                                    <div class="flex justify-between items-center mb-1">
                                        <span class="font-semibold text-gray-900 text-sm truncate max-w-[130px]">${s.name}</span>
                                        <span class="text-xs font-bold text-gray-700">${s.completedCount}/${totalTests}</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden border border-gray-300">
                                        <div class="h-2.5 rounded-full transition-all duration-500" style="width: ${percent}%; background: linear-gradient(to right, #3b82f6, #22c55e);"></div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderChecklist(testNames, students) {
            const container = document.getElementById('certification-checklist');
            if (!container) return;

            container.innerHTML = `
                <div class="relative overflow-auto max-h-[580px] border border-gray-300 rounded-lg shadow-sm">
                    <table class="min-w-full text-xs border-separate border-spacing-0">
                        <thead>
                            <tr>
                                <th class="px-4 py-3 text-left font-bold text-gray-900 bg-gray-200 border-r-2 border-b-2 border-gray-400 sticky left-0 top-0 z-40 min-w-[14rem]">Student Name</th>
                                ${testNames.map(test => `
                                    <th class="px-2 py-3 text-center font-bold text-gray-900 bg-gray-100 border-r border-b-2 border-gray-400 sticky top-0 z-30 w-28 min-w-[7rem] max-w-[8rem] whitespace-normal break-words">
                                        ${test}
                                    </th>
                                `).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${students.map((s, idx) => {
                                const rowBg = idx % 2 === 0 ? 'bg-white' : 'bg-slate-100';
                                const stickyBg = idx % 2 === 0 ? 'bg-white' : 'bg-[#f1f5f9]';
                                return `
                                    <tr class="${rowBg} hover:bg-blue-50/40">
                                        <td class="px-4 py-3 font-semibold text-gray-900 border-r-2 border-b border-gray-400 sticky left-0 ${stickyBg} z-20 whitespace-nowrap shadow-sm">${s.name}</td>${testNames.map(test => `
                                            <td class="px-2 py-3 text-center border-r border-b border-gray-200">
                                                ${s.tests[test] ? '<span class="text-green-600 font-extrabold text-sm">✔</span>' : '<span class="text-gray-300 font-light">-</span>'}
                                            </td>
                                        `).join('')}
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Load immediately when page opens
        document.addEventListener('DOMContentLoaded', () => {
            loadTrackerData();
            // Automatically re-fetch data every 30 seconds in the background
            setInterval(loadTrackerData, 30000);
        });
    </script>
